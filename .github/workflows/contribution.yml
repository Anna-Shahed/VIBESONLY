
on:
  schedule:
    # Runs exactly at the start of every hour (24 times a day)
    - cron: '0 * * * *'
  workflow_dispatch: # Allows you to click "Run workflow" manually to test it

jobs:
  make-contribution:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Crucial permission to allow pushing code back to the repo

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Ensures full history is available for clean pushing

    - name: Run Structured Commits and Push Linear History
      run: |
        # 1. Determine the current UTC hour (0 to 23)
        CURRENT_HOUR=$(date -u +%-H)
        
        # 2. Assign commit distribution to hit exactly 74:
        # Hours 0-21 (22 hours) get 3 commits each = 66 commits
        # Hours 22-23 (2 hours) get 4 commits each  = 8 commits
        # Total = 66 + 8 = 74 commits daily
        if [ "$CURRENT_HOUR" -ge 22 ]; then
          COMMIT_COUNT=4
        else
          COMMIT_COUNT=3
        fi
        
        # 3. Configure Git inside the runner
        git config --global user.name 'github-actions[bot]'
        git config --global user.email '41898282+github-actions[bot]@://github.com'
        
        # 4. Loop to create distinct, sequential commits
        for i in $(seq 1 $COMMIT_COUNT); do
          echo "Activity log entry: $(date -u) (Commit $i/$COMMIT_COUNT for hour $CURRENT_HOUR)" >> contribution_log.txt
          git add contribution_log.txt
          
          # Using [skip ci] prevents the automated commit from triggering an accidental workflow loop
          git commit -m "automated: structured repository update [skip ci]"
          sleep 1
        done

        # 5. Explicitly fetch and rebase to strictly avoid generating merge commits (violating rulesets)
        git fetch origin ${{ github.ref_name }}
        git rebase origin/${{ github.ref_name }}
        
        # 6. Push all batched commits safely back to the repository
        git push origin HEAD:${{ github.ref_name }}
